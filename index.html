<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelly Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=volume-01" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="intro-panel" lang="en">
        <h1>Jelly<br />Lab.</h1>
      </aside>

      <main class="scene-panel">
        <canvas id="scene"></canvas>
        <div class="hint-pill" id="hint">젤리를 잡아당겨 보세요</div>
      </main>

      <aside class="control-panel">
        <div class="panel-card">
          <div class="panel-header">
            <p class="eyebrow">젤리 설정</p>
            <span class="status-dot"></span>
          </div>

          <label class="control-row">
            <span>질량감</span>
            <input id="mass" type="range" min="0.3" max="1.8" step="0.01" value="1.25" />
            <output id="massValue">1.25</output>
          </label>

          <label class="control-row">
            <span>탄성</span>
            <input id="firmness" type="range" min="0.05" max="0.4" step="0.005" value="0.12" />
            <output id="firmnessValue">0.12</output>
          </label>

          <label class="control-row">
            <span>내부 감쇠</span>
            <input id="damping" type="range" min="0.75" max="0.98" step="0.005" value="0.9" />
            <output id="dampingValue">0.90</output>
          </label>

          <label class="control-row">
            <span>표면 매끈함</span>
            <input id="smoothing" type="range" min="0.01" max="0.14" step="0.005" value="0.08" />
            <output id="smoothingValue">0.08</output>
          </label>

          <div class="button-row">
            <button id="nudge" type="button">툭 치기</button>
            <button id="reset" type="button" class="secondary">초기화</button>
          </div>

          <div class="checkbox-row">
            <label><input id="autorotate" type="checkbox" checked /> 느린 회전</label>
            <label><input id="shadowToggle" type="checkbox" checked /> 그림자</label>
          </div>
        </div>
      </aside>
    </div>

    <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.167.1/build/three.module.js"}}</script>
    <script type="module" src="./app.js?v=volume-01"></script>
  </body>
</html>
