<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelly Jam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=recovery-08" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="intro-panel" lang="en">
        <h1>Jelly<br />Jam.</h1>
      </aside>

      <main class="scene-panel">
        <canvas id="scene"></canvas>
        <div class="hint-pill" id="hint">젤리를 잡아당겨 보세요</div>
      </main>

      <aside class="control-panel">
        <div class="panel-card">
          <div class="panel-header">
            <p class="eyebrow">젤리 설정</p>
            <span class="status-dot"></span>
          </div>

          <label class="shape-row">젤리 모양<select id="shape"><option value="cat">고양이</option><option value="vocal">보컬 캐릭터</option><option value="dj">DJ 캐릭터</option></select></label>

          <label class="control-row">
            <span>질량감</span>
            <input id="mass" type="range" min="0.3" max="1.8" step="0.01" value="1.25" />
            <output id="massValue">1.25</output>
          </label>

          <label class="control-row">
            <span>탄성</span>
            <input id="firmness" type="range" min="0.05" max="0.4" step="0.005" value="0.06" />
            <output id="firmnessValue">0.06</output>
          </label>

          <label class="control-row"><span>반사광 밝기</span><input id="brightness" type="range" min="0" max="2.5" step="0.05" value="1" /><output id="brightnessValue">1.00</output></label>

          <label class="control-row"><span>확대</span><input id="zoom" type="range" min="0.75" max="1.8" step="0.05" value="1" /><output id="zoomValue">1.00</output></label>

          <div class="button-row">
            <button id="nudge" type="button">툭 치기</button>
            <button id="reset" type="button" class="secondary">초기화</button>
          </div>

          <div class="checkbox-row">
            <label><input id="autorotate" type="checkbox" checked /> 느린 회전</label>
            <label><input id="shadowToggle" type="checkbox" checked /> 그림자</label>
          </div>
        </div>
      </aside>
    </div>

    <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.167.1/build/three.module.js"}}</script>
    <script type="module" src="./app.js?v=recovery-08"></script>
  </body>
</html>
