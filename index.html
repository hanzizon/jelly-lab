<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelly Jam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=carbonation-24" />
  </head>
  <body>
    <div class="page-shell">

      <main class="scene-panel">
        <canvas id="scene"></canvas>
        
      </main>

      <aside class="control-panel">
        <button id="panelToggle" type="button" aria-expanded="true" aria-controls="settingsBody">설정 접기 ▾</button>
        <div class="panel-card" id="settingsBody">
          <div class="panel-header">
            <p class="eyebrow">젤리 설정</p>
            <div class="appearance-options">
              <span class="status-dot" aria-hidden="true"></span>
              <input id="jellyColor" type="color" value="#2f6bff" aria-label="젤리 색상" title="젤리 색상" />
              <label class="bubble-option"><input id="bubbles" type="checkbox" /> 기포</label>
            </div>
          </div>
          <label class="sound-option"><input id="bubbleSound" type="checkbox" checked /> 탄산 소리</label>

          <label class="shape-row">젤리 모양<select id="shape"><option value="cat">고양이</option><option value="vocal">보컬 캐릭터</option><option value="dj">DJ 캐릭터</option></select></label>

          <label class="control-row">
            <span>질량감</span>
            <input id="mass" type="range" min="0.3" max="1.8" step="0.01" value="1.25" />
            <output id="massValue">1.25</output>
          </label>

          <label class="control-row">
            <span>탄성</span>
            <input id="firmness" type="range" min="0.05" max="0.4" step="0.005" value="0.06" />
            <output id="firmnessValue">0.06</output>
          </label>

          <label class="control-row"><span>반사광 밝기</span><input id="brightness" type="range" min="0" max="2.5" step="0.05" value="1" /><output id="brightnessValue">1.00</output></label>

          <label class="control-row"><span>젤리 불투명도</span><input id="opacity" type="range" min="10" max="90" step="1" value="50" /><output id="opacityValue">50%</output></label>

          <div class="button-row">
            <button id="nudge" type="button">툭 치기</button>
            <button id="reset" type="button" class="secondary">초기화</button>
          </div>

          <div class="checkbox-row">
            <label><input id="autorotate" type="checkbox" checked /> 느린 회전</label>
            <label><input id="shadowToggle" type="checkbox" checked /> 그림자</label>
          </div>
          <section class="view-controls" aria-label="화면 보기">
            <p class="eyebrow">화면 보기</p>
            <label class="control-row"><span>확대</span><input id="zoom" type="range" min="0.75" max="1.8" step="0.05" value="1" /><output id="zoomValue">1.00</output></label>
            <label class="control-row"><span>시야 각도</span><input id="viewAngle" type="range" min="0" max="90" step="1" value="45" /><output id="viewAngleValue">45°</output></label>
          </section>
          <div class="background-controls">
            <label for="backgroundPhoto">배경 사진</label>
            <input id="backgroundPhoto" type="file" accept="image/jpeg,image/png,image/webp,image/avif" />
            <button id="backgroundReset" type="button" class="secondary" disabled>기본 배경</button>
            <label class="control-row photo-scale"><span>사진 크기</span><input id="photoScale" type="range" min="25" max="200" step="5" value="100" /><output id="photoScaleValue">100%</output></label>
            <p id="backgroundStatus" role="status" aria-live="polite">사진을 선택하면 원근감이 자동으로 적용됩니다.</p>
          </div>
        </div>
      </aside>
    </div>

    <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.167.1/build/three.module.js"}}</script>
    <script type="module" src="./app.js?v=carbonation-24"></script>
  </body>
</html>
